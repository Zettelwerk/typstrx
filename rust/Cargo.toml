[package]
name = "typstrx"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
typst = "=0.15.0"
typst-layout = "=0.15.0"
# Upstream typst-render can only rasterize whole pages. It is kept only so the
# render tests can assert the clipped renderer is bit-identical to cropping its
# output; nothing in the shipping path uses it.
typst-render = "=0.15.0"
# Modified copy of typst-render 0.15.0 adding clipped (tile) rasterization —
# see third_party/typst-render-clip/NOTICE.md.
typst-render-clip = { path = "../third_party/typst-render-clip" }
# Parser + syntax tree + Tag-based highlighting categorization, used directly
# for editor syntax highlighting (independent of compilation).
typst-syntax = "=0.15.0"
# IDE support (completion, hover) built on typst/typst-layout, which are
# already in the tree — adds no new transitive dependencies of its own.
typst-ide = "=0.15.0"
typst-kit = { version = "=0.15.0", default-features = false, features = [
    "embedded-fonts",
    "datetime",
    "system-packages",
    "universe-packages",
    "system-downloader",
] }
comemo = "0.5"
ecow = "0.2"
parking_lot = "0.12"
tiny-skia = "0.12"
# Parses the `@preview` package index (a plain JSON array) for `@`-completions —
# already in the tree transitively via typst's own serde usage.
serde_json = "1"

# OpenSSL has no system copy on Android; build it from source there only.
[target.'cfg(target_os = "android")'.dependencies]
typst-kit = { version = "=0.15.0", default-features = false, features = ["vendor-openssl"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
