name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --locked

  windows:
    name: Windows (Rust tests, example)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test Rust on Windows
        run: cargo test --manifest-path rust/Cargo.toml --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build example for Windows
        run: flutter build windows --release
        working-directory: example
  dart:
    name: Dart (analyze, tests, publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: dart pub publish --dry-run
        run: |
          set +e
          output="$(dart pub publish --dry-run 2>&1)"
          status=$?
          echo "$output"
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # flutter_rust_bridge is pinned exactly on purpose (must match
          # rust/Cargo.toml's `=` pin), which pub always flags as a warning.
          # Fail on anything else: a real error, or any other warning.
          if echo "$output" | grep -qi "error"; then
            echo "::error::dart pub publish --dry-run reported an error"
            exit 1
          fi
          unexpected="$(echo "$output" | grep -E '^\* ' | grep -v 'flutter_rust_bridge' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected pub publish warning(s):"
            echo "$unexpected"
            exit 1
          fi

  linux-example:
    name: Build example (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build linux --debug
        working-directory: example

  android-example:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --debug
        working-directory: example
