name: Precompile Rust binaries

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "cargokit/**"
      - ".github/workflows/precompile-binaries.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precompile:
    name: Precompile (Linux + Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install cargokit build_tool dependencies
        working-directory: cargokit/build_tool
        run: dart pub get

      - name: Ensure Android NDK is installed
        env:
          NDK_VERSION: 27.0.12077973
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "--- installed NDK versions ---"
          find "$ANDROID_HOME/ndk" -maxdepth 1
          echo "--- toolchain bin dir for $NDK_VERSION ---"
          ls -la "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -i ar || true

      # cargokit computes a hash of the Rust crate and skips any target
      # whose artifacts already exist for that hash, so re-running this on
      # every push to main (even when rust/ didn't change) is a no-op.
      - name: Precompile and publish binaries
        working-directory: cargokit/build_tool
        env:
          PRIVATE_KEY: ${{ secrets.CARGOKIT_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dart run bin/build_tool.dart precompile-binaries \
            --repository Zettelwerk/typstrx \
            --manifest-dir ../../rust \
            --target x86_64-unknown-linux-gnu \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            --android-sdk-location "$ANDROID_HOME" \
            --android-ndk-version 27.0.12077973 \
            --android-min-sdk-version 21 \
            --verbose
